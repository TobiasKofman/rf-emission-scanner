[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rfsense"
version = "0.1.0"
description = "Passive 2.4 GHz RF emitter detection (drone FHSS control links) with an ADALM-Pluto + Raspberry Pi 5"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "pyserial>=3.5",
]

[project.optional-dependencies]
# Only needed on the machine physically attached to the Pluto (the Pi).
sdr = ["pyadi-iio>=0.0.17"]
dev = ["pytest>=7", "matplotlib>=3.7"]

[project.scripts]
rfsense = "rfsense.__main__:main"

[tool.setuptools.packages.find]
include = ["rfsense*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
